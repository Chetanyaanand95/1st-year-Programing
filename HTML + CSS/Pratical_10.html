<!DOCTYPE html>
<html>
<head>
    <title>Footer Section</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        .footer {
            background-color: #222;
            color: white;
            padding: 20px 0;
            text-align: center;
        }

        .footer-container {
            width: 90%;
            margin: auto;
        }

        .footer-box {
            width: 30%;
            display: inline-block;
            vertical-align: top;
            margin: 10px;
        }

        .footer-box h3 {
            margin-bottom: 10px;
        }

        .footer-box p {
            font-size: 14px;
        }

        .copyright {
            margin-top: 15px;
            font-size: 13px;
            border-top: 1px solid gray;
            padding-top: 10px;
        }
    </style>
</head>

<body>

    <div class="footer">

        <div class="footer-container">

            <div class="footer-box">
                <h3>About Us</h3>
                <p>We provide quality web design services using HTML and CSS.</p>
            </div>

            <div class="footer-box">
                <h3>Quick Links</h3>
                <p>Home<br>Services<br>Contact</p>
            </div>

            <div class="footer-box">
                <h3>Contact</h3>
                <p>Email: info@example.com<br>Phone: +91 9876543210</p>
            </div>

            <div class="copyright">
                © 2026 My Website | All Rights Reserved
            </div>

        </div>

    </div>

</body>
</html>
