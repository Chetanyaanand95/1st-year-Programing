<!DOCTYPE html>
<html>
<head>
    <title>Different Text Styles</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f4f4f4;
        }

        .bold {
            font-weight: bold;
        }

        .italic {
            font-style: italic;
        }

        .underline {
            text-decoration: underline;
        }

        .color {
            color: blue;
        }

        .size {
            font-size: 24px;
        }

        .spacing {
            letter-spacing: 3px;
        }
    </style>
</head>

<body>

    <h1>Different Text Styles</h1>

    <p class="bold">This text is Bold</p>
    <p class="italic">This text is Italic</p>
    <p class="underline">This text is Underlined</p>
    <p class="color">This text is Blue Color</p>
    <p class="size">This text is Larger Size</p>
    <p class="spacing">This text has Letter Spacing</p>

</body>
</html>
