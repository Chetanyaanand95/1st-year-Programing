<!DOCTYPE html>
<html>
<head>
    <title>Product Price Table</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-top: 20px;
        }

        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: white;
        }

        th {
            background-color: #4CAF50;
            color: white;
            padding: 10px;
        }

        td {
            padding: 10px;
            border: 1px solid #ddd;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: #ddd;
        }
    </style>
</head>

<body>

    <h1>Product Price List</h1>

    <table>
        <tr>
            <th>Product Name</th>
            <th>Category</th>
            <th>Price</th>
            <th>Availability</th>
        </tr>

        <tr>
            <td>Wireless Mouse</td>
            <td>Electronics</td>
            <td>₹499</td>
            <td>In Stock</td>
        </tr>

        <tr>
            <td>Bluetooth Headphones</td>
            <td>Electronics</td>
            <td>₹1299</td>
            <td>In Stock</td>
        </tr>

        <tr>
            <td>Notebook</td>
            <td>Stationery</td>
            <td>₹99</td>
            <td>Out of Stock</td>
        </tr>

        <tr>
            <td>Water Bottle</td>
            <td>Accessories</td>
            <td>₹199</td>
            <td>In Stock</td>
        </tr>
    </table>

</body>
</html>
