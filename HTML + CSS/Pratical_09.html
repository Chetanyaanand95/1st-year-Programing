<!DOCTYPE html>
<html>
<head>
    <title>FAQ Section</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #f4f4f4;
        }

        h1 {
            text-align: center;
            margin: 20px;
        }

        .container {
            width: 80%;
            margin: auto;
        }

        .faq {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0 0 5px gray;
        }

        .question {
            font-weight: bold;
            color: #4CAF50;
        }

        .answer {
            margin-top: 5px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <h1>Frequently Asked Questions</h1>

    <div class="container">

        <div class="faq">
            <p class="question">1. What is HTML?</p>
            <p class="answer">HTML is used to create the structure of web pages.</p>
        </div>

        <div class="faq">
            <p class="question">2. What is CSS?</p>
            <p class="answer">CSS is used to style and design web pages.</p>
        </div>

        <div class="faq">
            <p class="question">3. Is HTML and CSS enough for websites?</p>
            <p class="answer">Yes, they are enough for creating static websites.</p>
        </div>

    </div>

</body>
</html>
