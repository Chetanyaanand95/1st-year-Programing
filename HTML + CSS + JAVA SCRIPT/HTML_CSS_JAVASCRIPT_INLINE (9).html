<!DOCTYPE html>
<html>

<head>
<script>
function count() {
    let text = document.getElementById("msg").value;
    document.getElementById("count").innerHTML =
        "Characters: " + text.length;
}
</script>

<style>
textarea {
    width: 400px;
    height: 150px;
    font-size: 16px;
    padding: 10px;
}
</style>

</head>

<body>

<h2>Character Counter</h2>

<textarea id="msg" onkeyup="count()"></textarea>

<p id="count">Characters: 0</p>

</body>

</html>
