<!DOCTYPE html>
<html>

<head>
<script>
function grade() {
    let m1 = parseInt(document.getElementById("m1").value);
    let m2 = parseInt(document.getElementById("m2").value);
    let m3 = parseInt(document.getElementById("m3").value);

    let total = m1 + m2 + m3;
    let avg = total / 3;
    let g;

    if (avg >= 80) g = "A";
    else if (avg >= 60) g = "B";
    else if (avg >= 40) g = "C";
    else g = "Fail";

    document.getElementById("res").innerHTML =
        "Total = " + total + " | Grade = " + g;
}
</script>
</head>

<body>

<h2>Grade Calculator</h2>

<input id="m1" placeholder="Marks1">
<input id="m2" placeholder="Marks2">
<input id="m3" placeholder="Marks3">

<br><br>

<button onclick="grade()">Calculate</button>

<h3 id="res"></h3>

</body>

</html>
