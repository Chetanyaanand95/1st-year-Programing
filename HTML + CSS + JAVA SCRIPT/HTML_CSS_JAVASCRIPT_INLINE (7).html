<!DOCTYPE html>
<html>
<head>
<script>
function toggle() {
    let p = document.getElementById("pass");
    if (p.type == "password")
        p.type = "text";
    else
        p.type = "password";
}
</script>
</head>

<body>

<h2>Login</h2>

Username:
<input type="text">

<br><br>

Password:
<input type="password" id="pass">

<br><br>

<input type="checkbox" onclick="toggle()"> Show Password

</body>
</html>
